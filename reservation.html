</head>
<body>
  <!-- Header giống home.html -->

  <div class="hero" style="background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=80');">

      <h1>Đặt lịch</h1>
      <p>Đặt bàn hoặc đặt tiệc nhanh chóng tại HaDiDi Restaurant</p>
    </div>
  </div>

  <div class="container main-content">
    <div class="contact-section">
      <form>
        <input type="text" placeholder="Họ và tên" required>
        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Số điện thoại" required>
        <input type="date" required>
        <input type="time" required>
        <textarea placeholder="Ghi chú (tuỳ chọn)"></textarea>
        <button type="submit">Đặt lịch</button>
      </form>
    </div>
  </div>
