<body>
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <a href="../home/home.html">

      </div>
      
      <nav class="nav-desktop">
        <ul class="nav-links">
          <li><a href="../home/home.html" class="nav-link">Trang chủ</a></li>

      </div>
      
      <button class="mobile-toggle">
        <span class="bar"></span>
        <span class="bar"></span>

    <nav class="nav-mobile">
      <ul class="mobile-links">
